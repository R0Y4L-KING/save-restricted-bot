services:
  - type: web
    name: save-restricted-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Runtime ---
      # Fully qualified version required. Matches the Dockerfile.
      - key: PYTHON_VERSION
        value: "3.10.13"
      # --- Telegram Bot Credentials ---
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      # --- Admin ---
      - key: ADMINS
        sync: false
      # --- Database ---
      - key: DB_URI
        sync: false
      - key: DB_NAME
        value: SaveRestricted2
      # --- Logging / Errors ---
      - key: LOG_CHANNEL
        sync: false
      - key: ERROR_MESSAGE
        value: "True"
      # --- Premium / payment screen ---
      - key: SUBSCRIPTION
        value: https://graph.org/file/242b7f1b52743938d81f1.jpg
      - key: UPI_ID
        value: 20213904@axl
      - key: QR_CODE
        value: https://raw.githubusercontent.com/R0Y4L-KING/save-restricted-bot/main/assets/upi_qr.png
      # --- Start screen photos ---
      - key: START_PHOTO
        value: https://raw.githubusercontent.com/R0Y4L-KING/save-restricted-bot/main/assets/start_banner.jpg
      - key: START_PHOTO_FALLBACK
        value: https://raw.githubusercontent.com/R0Y4L-KING/save-restricted-bot/main/assets/start_fallback.jpg
