services:
  - type: web
    name: save-restricted-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Telegram Bot Credentials ---
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      # --- Admin ---
      - key: ADMINS
        sync: false
      # --- Database ---
      - key: DB_URI
        sync: false
      - key: DB_NAME
        value: SaveRestricted2
      # --- Logging / Errors ---
      - key: LOG_CHANNEL
        sync: false
      - key: ERROR_MESSAGE
        value: "True"
      # --- Optional (premium / payment screen) ---
      - key: SUBSCRIPTION
        sync: false
      - key: UPI_ID
        sync: false
      - key: QR_CODE
        sync: false
